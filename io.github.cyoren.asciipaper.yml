app-id: io.github.cyoren.asciipaper
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: asciipaper
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
modules:
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
      - --prefix=/app
      - --libdir=lib
    sources:
      - type: git
        url: https://github.com/wmww/gtk4-layer-shell.git
        tag: v1.3.0
        commit: 1c963c51514581c41b9bdae08cdf69171265cdda
  - name: asciipaper
    buildsystem: simple
    build-commands:
      - install -Dm755 asciipaper /app/bin/asciipaper
      - install -Dm644 wallpapers/fluid.html /app/share/asciipaper/wallpapers/fluid.html
      - install -Dm644 wallpapers/flow.html /app/share/asciipaper/wallpapers/flow.html
      - install -Dm644 wallpapers/matrix.html /app/share/asciipaper/wallpapers/matrix.html
      - install -Dm644 wallpapers/yin-yang.html /app/share/asciipaper/wallpapers/yin-yang.html
      - install -Dm644 wallpapers/starter.html /app/share/asciipaper/wallpapers/starter.html
      - install -Dm644 wallpapers/lib/asciify-core.js /app/share/asciipaper/wallpapers/lib/asciify-core.js
      - install -Dm644 wallpapers/lib/asciipaper.js /app/share/asciipaper/wallpapers/lib/asciipaper.js
      - install -Dm644 wallpapers/lib/asciify-engine-MIT.txt /app/share/asciipaper/wallpapers/lib/asciify-engine-MIT.txt
      - install -Dm644 licenses/asciify-engine-MIT.txt /app/share/licenses/asciipaper/asciify-engine-MIT.txt
      - install -Dm644 io.github.cyoren.asciipaper.desktop /app/share/applications/io.github.cyoren.asciipaper.desktop
      - install -Dm644 io.github.cyoren.asciipaper.svg /app/share/icons/hicolor/scalable/apps/io.github.cyoren.asciipaper.svg
      - install -Dm644 io.github.cyoren.asciipaper.metainfo.xml /app/share/metainfo/io.github.cyoren.asciipaper.metainfo.xml
    sources:
      # Pin this source to a tagged, pushed upstream release before Flathub submission.
      - type: git
        url: https://github.com/cYoren/asciipaper.git
        branch: main
