<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My asciipaper wallpaper</title>
<script src="./lib/asciipaper.js"></script>
<style>
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#080909 }
  canvas { display:block; width:100%; height:100% }
</style>
<canvas id="art"></canvas>
<script>
// Your canvas fills the screen and follows monitor size changes.
const canvas = document.querySelector('#art');
const ctx = canvas.getContext('2d');
const glyphs = ' .,:;irsXA253hMHGS#9B&@';
const MAX_GLYPHS = 1600, MAX_FPS = 12;
let cols, rows, cell = 12, mouse = { x: .5, y: .5 }, lastFrame = 0;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cell = Math.max(18, Math.sqrt(innerWidth * innerHeight / MAX_GLYPHS));
  cols = Math.ceil(innerWidth / cell); rows = Math.ceil(innerHeight / cell);
}
addEventListener('resize', resize); resize();
addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth; mouse.y = e.clientY / innerHeight; });

function draw(time) {
  requestAnimationFrame(draw);
  const fps = Math.min(MAX_FPS, window.asciipaper?.options?.fps ?? MAX_FPS);
  if (time - lastFrame < 1000 / fps) return;
  lastFrame = time;
  const w = innerWidth, h = innerHeight, t = time * .001;
  ctx.fillStyle = '#080909'; ctx.fillRect(0, 0, w, h);
  ctx.font = `${cell}px monospace`;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    // Replace this example wave with any animation you can calculate per cell.
    const u = x / cols, v = y / rows;
    const pointer = window.asciipaper?.options?.pointer ?? 1;
    const wave = Math.sin(u * 18 + t * 1.2 + mouse.x * 3 * pointer) + Math.cos(v * 14 - t + mouse.y * 4 * pointer);
    const index = Math.max(0, Math.min(glyphs.length - 1, Math.floor((wave + 2) / 4 * glyphs.length)));
    ctx.fillStyle = `hsl(${175 + wave * 16} 75% ${25 + (wave + 2) * 12}%)`;
    ctx.fillText(glyphs[index], x * cell, y * cell);
  }
}
requestAnimationFrame(draw);
</script>
