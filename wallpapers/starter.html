<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My asciipaper wallpaper</title>
<script src="./lib/asciipaper.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#080909}</style>
<script>
// Preview while you edit (reloads on save):  asciipaper preview "<this file>"
//
// cell(uv) runs on the GPU once per character cell. uv is the cell centre, 0..1 from the top left.
// Return vec4(r, g, b, level): level 0..1 picks a glyph from `charset` (0 = first, 1 = last).
// Built in: u_time (s), u_grid (cols, rows), u_size (px), u_aspect, u_pointer (0..1),
// u_velocity, u_down, u_idle (s since the pointer moved), u_strength (pointer setting),
// u_clicks[8] (x, y, age in s). Your own: declare `uniform float speed;` and set
// scene.uniforms.speed in update(). Prefer JavaScript? Leave out glsl and call
// scene.put(col, row, level, r, g, b) in update() instead.
asciipaper.ascii({
  charset: ' .,:;irsXA253hMHGS#9B&@',
  cell: 12, aspect: .6, background: '#080909',
  glsl: `
vec4 cell(vec2 uv){
  vec2 m=u_pointer*u_strength;
  float wave=sin(uv.x*18.0+u_time*1.2+m.x*3.0)+cos(uv.y*14.0-u_time+m.y*4.0);
  for(int i=0;i<8;i++){vec3 c=u_clicks[i];                        // clicks send out a ring
    wave+=2.0*max(0.0,1.0-c.z)*smoothstep(0.03,0.0,abs(length((uv-c.xy)*vec2(u_aspect,1.0))-c.z*0.6));}
  float level=clamp((wave+2.0)/4.0,0.0,1.0);
  vec3 color=vec3(0.2,0.75,0.7)*(0.35+level*0.8);
  return vec4(color,level);
}`,
  update(scene, dt) {},
});
</script>
