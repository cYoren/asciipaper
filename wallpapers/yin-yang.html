<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cursor Yin Yang — asciipaper</title>
<script src="./lib/asciipaper.js"></script>
<style>
  * { box-sizing: border-box }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080909 }
  canvas { display: block; width: 100%; height: 100% }
</style>
<canvas id="wallpaper" aria-label="A rotating ASCII yin-yang responsive to pointer movement"></canvas>
<script>
const canvas = document.querySelector('#wallpaper');
const ctx = canvas.getContext('2d', { alpha: false });
const chars = ' .,:;irsXA253hMHGS#9B&@';
let width = 0, height = 0, cellW = 9, cellH = 15, columns = 0, rows = 0;
let pointerX = .5, pointerY = .5, targetX = .5, targetY = .5;
let angle = 0, last = 0, ripples = [];

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  width = innerWidth; height = innerHeight;
  canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `${cellH}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
  columns = Math.ceil(width / cellW); rows = Math.ceil(height / cellH);
}
addEventListener('resize', resize); resize();
addEventListener('pointermove', e => { targetX = e.clientX / width; targetY = e.clientY / height; });
addEventListener('pointerdown', e => {
  targetX = e.clientX / width; targetY = e.clientY / height;
  ripples.push({ x: targetX, y: targetY, born: performance.now() });
});
addEventListener('pointerleave', () => { targetX = .5; targetY = .5; });

function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 40) return; // 25 fps keeps a desktop wallpaper light
  const dt = Math.min((now - last) / 1000 || .04, .08); last = now;
  pointerX += (targetX - pointerX) * .08; pointerY += (targetY - pointerY) * .08;
  const pointerStrength = window.asciipaper?.options?.pointer ?? 1;
  const near = Math.hypot(pointerX - .5, pointerY - .5) * pointerStrength;
  angle += dt * (.24 + Math.min(near, .5) * .9);
  ctx.fillStyle = '#080909'; ctx.fillRect(0, 0, width, height);

  // The emblem scales to the viewport. Pointer position gently pulls its axis.
  const radius = Math.max(30, Math.min(width * .31, height * .40));
  const cx = width * (.5 + (pointerX - .5) * .12 * pointerStrength);
  const cy = height * (.5 + (pointerY - .5) * .12 * pointerStrength);
  const pullAngle = Math.atan2(pointerY - .5, pointerX - .5) * .10 * pointerStrength;
  const rot = angle + pullAngle;
  const ca = Math.cos(rot), sa = Math.sin(rot);
  const firstCol = Math.max(0, Math.floor((cx - radius * 1.04) / cellW));
  const lastCol = Math.min(columns, Math.ceil((cx + radius * 1.04) / cellW));
  const firstRow = Math.max(0, Math.floor((cy - radius * 1.04) / cellH));
  const lastRow = Math.min(rows, Math.ceil((cy + radius * 1.04) / cellH));
  for (let row = firstRow; row < lastRow; row++) for (let col = firstCol; col < lastCol; col++) {
    const sx = col * cellW + cellW * .5 - cx, sy = row * cellH + cellH * .5 - cy;
    const x = (sx * ca + sy * sa) / radius;
    const y = (-sx * sa + sy * ca) / radius;
    const r = Math.hypot(x, y);
    if (r > 1.035) continue;

    // S-shaped halves and the two opposing dots form the taijitu.
    const side = x - .42 * Math.sin(Math.PI * y);
    let white = side < 0;
    if (Math.hypot(x, y - .5) < .14) white = false;
    if (Math.hypot(x, y + .5) < .14) white = true;
    const edge = r > .92;
    const grain = (Math.sin(x * 32 + y * 17) + Math.cos(y * 29 - x * 13)) * .5;
    const shade = Math.max(0, Math.min(chars.length - 1,
      Math.floor((edge ? .55 : .58 + grain * .12) * (chars.length - 1))));
    const glow = Math.max(0, 1 - Math.hypot(sx / width, sy / height) * 2.3);
    ctx.fillStyle = white
      ? `rgb(${Math.floor(196 + glow * 59)},${Math.floor(208 + glow * 47)},${Math.floor(206 + glow * 49)})`
      : `rgb(${Math.floor(30 + glow * 24)},${Math.floor(91 + glow * 55)},${Math.floor(91 + glow * 55)})`;
    ctx.fillText(chars[shade], col * cellW, row * cellH);
  }

  // Clicks send a subtle ring through the character field.
  ripples = ripples.filter(r => now - r.born < 1300);
  for (const ripple of ripples) {
    const age = (now - ripple.born) / 1000;
    const rr = age * .7, alpha = 1 - age / 1.3;
    const px = ripple.x * width, py = ripple.y * height;
    ctx.fillStyle = `rgba(143,230,218,${alpha * .7})`;
    for (let i = 0; i < 70; i++) {
      const a = i * Math.PI * 2 / 70;
      const xx = px + Math.cos(a) * rr * radius, yy = py + Math.sin(a) * rr * radius;
      if (xx > 0 && xx < width && yy > 0 && yy < height)
        ctx.fillText('·', Math.round(xx / cellW) * cellW, Math.round(yy / cellH) * cellH);
    }
  }
}
requestAnimationFrame(frame);
</script>
