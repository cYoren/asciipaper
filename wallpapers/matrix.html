<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789ABCDEF';
let cols, drops, size = 16;
function reset() { c.width = innerWidth; c.height = innerHeight; cols = Math.ceil(c.width / size); drops = Array(cols).fill(0).map(() => Math.random() * -50); }
addEventListener('resize', reset); reset();
setInterval(() => {
  x.fillStyle = 'rgba(0,0,0,0.08)'; x.fillRect(0, 0, c.width, c.height);
  x.font = size + 'px monospace';
  for (let i = 0; i < cols; i++) {
    x.fillStyle = Math.random() < 0.05 ? '#cfc' : '#0f4';
    x.fillText(chars[Math.random() * chars.length | 0], i * size, drops[i] * size);
    if (drops[i] * size > c.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}, 50);
</script>
