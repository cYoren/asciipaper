<!doctype html>
<meta charset="utf-8">
<script src="./lib/asciipaper.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789ABCDEF';
let cols, drops, size = 16, width = 0, height = 0;
function reset() {
  const quality = window.asciipaper?.options?.quality ?? 1;
  width = c.width = Math.max(1, Math.round(innerWidth * quality));
  height = c.height = Math.max(1, Math.round(innerHeight * quality));
  c.style.width = '100vw'; c.style.height = '100vh';
  cols = Math.ceil(width / size); drops = Array(cols).fill(0).map(() => Math.random() * -50);
}
addEventListener('resize', reset); reset();
addEventListener('asciipaper-settings', reset);
let last = 0;
function draw(now) {
  requestAnimationFrame(draw);
  if (now - last < 50) return;
  last = now;
  x.fillStyle = 'rgba(0,0,0,0.08)'; x.fillRect(0, 0, width, height);
  x.font = size + 'px monospace';
  for (let i = 0; i < cols; i++) {
    x.fillStyle = Math.random() < 0.05 ? '#cfc' : '#0f4';
    x.fillText(chars[Math.random() * chars.length | 0], i * size, drops[i] * size);
    if (drops[i] * size > height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
requestAnimationFrame(draw);
</script>
