<!doctype html>
<meta charset="utf-8">
<title>asciify fluid</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#080909}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// The Asciify "Fluid" background (asciify.org/docs/backgrounds/fluid), offline.
// FluidField + paintLiquidSource are ported verbatim from asciify-engine
// src/surface/fluid-field.ts; glyphs are rendered by the unmodified engine
// (lib/asciify-core.js). MIT, © ayangabryl — see ../licenses/asciify-engine-MIT.txt.
// Knobs: MIN_FONT = glyph cell px (asciify.org uses 7; smaller = finer + more CPU); MAX_GLYPHS caps density; FPS;
// SCALE = backing-buffer supersampling for smoother letters (GPU cost only; asciify.org uses devicePixelRatio, capped at 1.5).
import { DEFAULT_OPTIONS, imageToAsciiFrame } from './lib/asciify-core.js';

const MIN_FONT = 7, MAX_GLYPHS = 26e3, FPS = 30, SCALE = 2;
const OPTIONS = { ...DEFAULT_OPTIONS, fontSize: 7, charAspect: .58, charset: ' .:+-=xICA$FY#@',
  colorMode: 'fullcolor', accentColor: '#e8b900', normalize: false, contrast: .1, hoverStrength: 0, chromaKey: null };

class FluidField {
  constructor(aspect = 1, decayRate = 3.5, continuousWake = false) {
    this.continuousWake = continuousWake; this.decayRate = decayRate;
    this.aspect = Math.max(.25, Math.min(4, aspect));
    const resolution = continuousWake ? 96 : 64;
    this.columns = this.aspect >= 1 ? resolution : Math.round(resolution * this.aspect);
    this.rows = this.aspect >= 1 ? Math.round(resolution / this.aspect) : resolution;
    this.front = new Float32Array(this.columns * this.rows * 3); this.back = new Float32Array(this.front.length);
    this.strokes = []; this.advected = [0, 0, 0]; this.previous = null; this.energy = 0;
  }
  get active() { return this.energy > .0005 || this.strokes.length > 0; }
  move(x, y) {
    if (!Number.isFinite(x + y)) return;
    if (this.continuousWake && !this.previous) { this.previous = { x, y }; return; }
    const previous = this.previous ?? { x: x - .004, y: y - .001 };
    const dx = Math.max(-.09, Math.min(.09, x - previous.x)), dy = Math.max(-.09, Math.min(.09, y - previous.y));
    this.previous = { x, y };
    if (Math.abs(dx) + Math.abs(dy) < .0001) return;
    const speed = Math.min(1, Math.hypot(dx * this.aspect, dy) * 25 + .06);
    this.strokes.push({ x, y, dx, dy, speed, fromX: previous.x, fromY: previous.y });
    if (this.strokes.length > 12) this.strokes.shift();
  }
  leave() { this.previous = null; }
  clear() { this.front.fill(0); this.back.fill(0); this.strokes.length = 0; this.previous = null; this.energy = 0; }
  read(data, x, y, out) {
    const gx = Math.max(0, Math.min(this.columns - 1.001, x * (this.columns - 1)));
    const gy = Math.max(0, Math.min(this.rows - 1.001, y * (this.rows - 1)));
    const ix = Math.floor(gx), iy = Math.floor(gy), fx = gx - ix, fy = gy - iy;
    const top = (iy * this.columns + ix) * 3, bottom = top + this.columns * 3, lw = 1 - fx, tw = 1 - fy;
    out[0] = (data[top] * lw + data[top + 3] * fx) * tw + (data[bottom] * lw + data[bottom + 3] * fx) * fy;
    out[1] = (data[top + 1] * lw + data[top + 4] * fx) * tw + (data[bottom + 1] * lw + data[bottom + 4] * fx) * fy;
    out[2] = (data[top + 2] * lw + data[top + 5] * fx) * tw + (data[bottom + 2] * lw + data[bottom + 5] * fx) * fy;
  }
  sample(x, y, out) { this.read(this.front, x, y, out); }
  step(seconds) {
    if (!this.active) return;
    const dt = Math.max(0, Math.min(.05, seconds));
    const decay = Math.exp(-dt * this.decayRate), inkDecay = Math.exp(-dt * (this.decayRate + .5));
    const xScale = Math.max(1, this.aspect), yScale = Math.max(1, 1 / this.aspect);
    let peak = 0;
    for (let y = 0; y < this.rows; y++) for (let x = 0; x < this.columns; x++) {
      const i = (y * this.columns + x) * 3, u = x / (this.columns - 1), v = y / (this.rows - 1);
      const transport = this.continuousWake ? .65 : 2;
      this.read(this.front, u - this.front[i] * dt * transport, v - this.front[i + 1] * dt * transport, this.advected);
      let dx = this.advected[0] * decay, dy = this.advected[1] * decay, ink = this.advected[2] * inkDecay;
      for (const stroke of this.strokes) {
        let rx = (u - stroke.x) * xScale, ry = (v - stroke.y) * yScale;
        if (this.continuousWake) {
          const ax = (u - stroke.fromX) * xScale, ay = (v - stroke.fromY) * yScale;
          const bx = (stroke.x - stroke.fromX) * xScale, by = (stroke.y - stroke.fromY) * yScale;
          const along = Math.max(0, Math.min(1, (ax * bx + ay * by) / (bx * bx + by * by || 1)));
          rx = ax - bx * along; ry = ay - by * along;
          const distance = rx * rx + ry * ry;
          if (distance > .0225) continue;
          const weight = Math.exp(-distance / .0032), travel = Math.hypot(stroke.dx * xScale, stroke.dy * yScale);
          const curl = Math.min(.025, travel * .55);
          dx += (stroke.dx * 4.2 - ry * curl) * weight; dy += (stroke.dy * 4.2 + rx * curl) * weight;
          ink = Math.max(ink, Math.min(.7, travel * 18) * weight);
          continue;
        }
        const distance = rx * rx + ry * ry;
        if (distance > .045) continue;
        const weight = Math.exp(-distance / .0075), speed = stroke.speed;
        dx += (stroke.dx * 2.8 - ry * speed * .16) * weight; dy += (stroke.dy * 2.8 + rx * speed * .16) * weight;
        ink += speed * weight * .3;
      }
      this.back[i] = Math.max(-.18, Math.min(.18, dx)); this.back[i + 1] = Math.max(-.18, Math.min(.18, dy));
      this.back[i + 2] = Math.min(.8, ink);
      peak = Math.max(peak, Math.abs(dx), Math.abs(dy), ink);
    }
    [this.front, this.back] = [this.back, this.front];
    this.strokes.length = 0; this.energy = peak;
    if (!this.active) this.clear();
  }
}

function paintLiquidSource(pixels, width, height, aspect, time, flow) {
  const field = [0, 0, 0], moving = flow.active;
  for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
    const u = x / width, v = y / height;
    if (moving) flow.sample(u, v, field);
    const px = (u - .5 - field[0]) * aspect, py = v - .5 - field[1];
    const qx = px + .22 * Math.sin(py * 5.2 + time * .17) + .15 * Math.sin(px * 2.4 - py * 3.1 - time * .1);
    const qy = py + .19 * Math.sin(px * 3.5 + time * .13);
    const radius = Math.hypot(qx * .8 + .18, qy * 1.1);
    const folds = .5 + .5 * Math.sin(radius * 14 - qx * 2.8 + Math.sin(qy * 5) * 1.4 - time * .24);
    const cloud = .5 + .5 * Math.sin(qx * 3.6 - qy * 2.9 + time * .09);
    const light = Math.max(0, Math.min(1, folds * folds * (.48 + cloud * .32) - .075 + field[2] * .75));
    const value = Math.round(light * 255), i = (y * width + x) * 4;
    pixels[i] = pixels[i + 1] = pixels[i + 2] = value; pixels[i + 3] = 255;
  }
}
// Amber ink, as on asciify.org.
function tint(pixels) {
  for (let i = 0; i < pixels.length; i += 4) {
    const v = pixels[i] < 10 ? 0 : Math.min(255, pixels[i] * 1.45);
    pixels[i] = v; pixels[i + 1] = v * (185 / 232); pixels[i + 2] = 0; pixels[i + 3] = 255;
  }
}

// ---- engine pipeline, same as the site: paint → tint → asciify → draw ----
// Glyphs are drawn on the GPU (one quad, per-cell lookup into a glyph atlas), like asciify.org.
const c = document.getElementById('c');
const src = document.createElement('canvas'), sx = src.getContext('2d', { willReadFrequently: true });
let W, H, img, flow, cols = 0, rows = 0, cells;

const gl = c.getContext('webgl', { antialias: false, depth: false, stencil: false, premultipliedAlpha: false });
const CHARS = OPTIONS.charset, PAD = 3;                        // atlas tile padding px, as on asciify.org
const sh = (type, code) => { const o = gl.createShader(type); gl.shaderSource(o, code); gl.compileShader(o); return o; };
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x,1.0-p.y);gl_Position=vec4(p*2.0-1.0,0,1);}'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `precision mediump float;varying vec2 v;uniform sampler2D cells,atlas;uniform vec2 grid,cell,atlasSize;uniform float tile,pad;
void main(){vec2 g=v*grid;vec4 d=texture2D(cells,(floor(g)+0.5)/grid);vec2 l=fract(g);
vec2 uv=(vec2(floor(d.r*255.0+0.5)*tile,0.0)+pad+l*cell)/atlasSize;gl_FragColor=vec4(d.gba*texture2D(atlas,uv).a,1.0);}`));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
const ploc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(ploc); gl.vertexAttribPointer(ploc, 2, gl.FLOAT, false, 0, 0);
const tex = (unit) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  for (const k of ['WRAP_S', 'WRAP_T']) gl.texParameteri(gl.TEXTURE_2D, gl[`TEXTURE_${k}`], gl.CLAMP_TO_EDGE); return t; };
const cellTex = tex(0); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
const atlasTex = tex(1); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.uniform1i(gl.getUniformLocation(prog, 'cells'), 0); gl.uniform1i(gl.getUniformLocation(prog, 'atlas'), 1);
const U = (name) => gl.getUniformLocation(prog, name), gridLoc = U('grid');
const glyphIndex = Object.fromEntries([...CHARS].map((ch, i) => [ch, i]));

function buildAtlas(cellW, cellH) {                             // glyphs rasterized at exact cell size, as on asciify.org
  const a = document.createElement('canvas'), ax = a.getContext('2d');
  const tile = Math.ceil(cellW) + PAD * 2, tileH = Math.ceil(cellH) + PAD * 2;
  a.width = tile * CHARS.length; a.height = tileH;
  ax.font = `${.9 * Math.min(cellW / .55, cellH)}px "JetBrains Mono", monospace`;
  ax.textAlign = 'center'; ax.textBaseline = 'middle'; ax.fillStyle = '#fff';
  [...CHARS].forEach((ch, i) => ax.fillText(ch, i * tile + PAD + cellW / 2, PAD + cellH / 2));
  gl.activeTexture(gl.TEXTURE1); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, a);
  gl.uniform2f(U('cell'), cellW, cellH); gl.uniform2f(U('atlasSize'), a.width, a.height);
  gl.uniform1f(U('tile'), tile); gl.uniform1f(U('pad'), PAD);
}

function reset() {
  W = innerWidth; H = innerHeight; c.width = W * SCALE; c.height = H * SCALE;
  c.style.width = W + 'px'; c.style.height = H + 'px'; gl.viewport(0, 0, c.width, c.height);
  OPTIONS.fontSize = Math.max(MIN_FONT, Math.sqrt(W * H * OPTIONS.charAspect / MAX_GLYPHS));
  const n = Math.max(192, Math.min(384, Math.ceil(Math.max(W, H * OPTIONS.charAspect) / (OPTIONS.fontSize * OPTIONS.charSpacing))));
  const aspect = W / H;
  src.width = Math.max(1, Math.round(aspect >= 1 ? n : n * aspect)); src.height = Math.max(1, Math.round(aspect >= 1 ? n / aspect : n));
  img = sx.createImageData(src.width, src.height);
  flow = new FluidField(aspect);
  cols = 0;                                                     // cell texture is (re)built on the next frame
}
addEventListener('resize', reset); reset();
addEventListener('pointermove', e => flow.move(e.clientX / W, e.clientY / H));
addEventListener('pointerleave', () => flow.leave());

let last = 0, time = 12;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - .5) return;
  const dt = last ? Math.min(.05, (now - last) / 1000) : 1 / 60; last = now; time += dt;
  flow.step(dt);
  paintLiquidSource(img.data, src.width, src.height, W / H, time, flow);
  tint(img.data);
  sx.putImageData(img, 0, 0);
  const ascii = imageToAsciiFrame(src, OPTIONS, W, H).frame;
  if (!ascii.length) return;
  if (ascii.length !== rows || ascii[0].length !== cols) {
    rows = ascii.length; cols = ascii[0].length; cells = new Uint8Array(cols * rows * 4);
    gl.uniform2f(gridLoc, cols, rows); buildAtlas(c.width / cols, c.height / rows);
  }
  for (let j = 0, k = 0; j < rows; j++) for (let i = 0; i < cols; i++, k += 4) {
    const cell = ascii[j][i];
    cells[k] = glyphIndex[cell.char] ?? 0; cells[k + 1] = cell.r; cells[k + 2] = cell.g; cells[k + 3] = cell.b;
  }
  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, cols, rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, cells);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(frame);
</script>
