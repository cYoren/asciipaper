<!doctype html>
<meta charset="utf-8">
<title>asciify fluid</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#080909}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// The Asciify "Fluid" background (asciify.org/docs/backgrounds/fluid), offline, on the GPU.
// FluidField (pointer wake) is ported verbatim from asciify-engine src/surface/fluid-field.ts;
// paintLiquidSource + the site's amber tint are the same math, in GLSL. Which character each cell
// gets is decided by the unmodified engine (lib/asciify-core.js): its luminance→glyph table is read
// once at startup. MIT, © ayangabryl — see ../licenses/asciify-engine-MIT.txt.
// Per frame, JS only steps the small pointer field and issues two draw calls.
// Knobs: MIN_FONT = glyph cell px (asciify.org uses 7; smaller = finer); MAX_GLYPHS caps density; FPS;
// SCALE = backing-buffer supersampling for smoother letters (GPU cost only).
import { DEFAULT_OPTIONS, imageToAsciiFrame } from './lib/asciify-core.js';

const MIN_FONT = 7, MAX_GLYPHS = 26e3, FPS = 24, SCALE = 2, PAD = 3;
const OPTIONS = { ...DEFAULT_OPTIONS, fontSize: 7, charAspect: .58, charset: ' .:+-=xICA$FY#@',
  colorMode: 'fullcolor', accentColor: '#e8b900', normalize: false, contrast: .1, hoverStrength: 0, chromaKey: null };
const CHARS = OPTIONS.charset;

class FluidField {
  constructor(aspect = 1, decayRate = 3.5, continuousWake = false) {
    this.continuousWake = continuousWake; this.decayRate = decayRate;
    this.aspect = Math.max(.25, Math.min(4, aspect));
    const resolution = continuousWake ? 96 : 64;
    this.columns = this.aspect >= 1 ? resolution : Math.round(resolution * this.aspect);
    this.rows = this.aspect >= 1 ? Math.round(resolution / this.aspect) : resolution;
    this.front = new Float32Array(this.columns * this.rows * 3); this.back = new Float32Array(this.front.length);
    this.strokes = []; this.advected = [0, 0, 0]; this.previous = null; this.energy = 0;
  }
  get active() { return this.energy > .0005 || this.strokes.length > 0; }
  move(x, y) {
    if (!Number.isFinite(x + y)) return;
    if (this.continuousWake && !this.previous) { this.previous = { x, y }; return; }
    const previous = this.previous ?? { x: x - .004, y: y - .001 };
    const dx = Math.max(-.09, Math.min(.09, x - previous.x)), dy = Math.max(-.09, Math.min(.09, y - previous.y));
    this.previous = { x, y };
    if (Math.abs(dx) + Math.abs(dy) < .0001) return;
    const speed = Math.min(1, Math.hypot(dx * this.aspect, dy) * 25 + .06);
    this.strokes.push({ x, y, dx, dy, speed, fromX: previous.x, fromY: previous.y });
    if (this.strokes.length > 12) this.strokes.shift();
  }
  leave() { this.previous = null; }
  clear() { this.front.fill(0); this.back.fill(0); this.strokes.length = 0; this.previous = null; this.energy = 0; }
  read(data, x, y, out) {
    const gx = Math.max(0, Math.min(this.columns - 1.001, x * (this.columns - 1)));
    const gy = Math.max(0, Math.min(this.rows - 1.001, y * (this.rows - 1)));
    const ix = Math.floor(gx), iy = Math.floor(gy), fx = gx - ix, fy = gy - iy;
    const top = (iy * this.columns + ix) * 3, bottom = top + this.columns * 3, lw = 1 - fx, tw = 1 - fy;
    out[0] = (data[top] * lw + data[top + 3] * fx) * tw + (data[bottom] * lw + data[bottom + 3] * fx) * fy;
    out[1] = (data[top + 1] * lw + data[top + 4] * fx) * tw + (data[bottom + 1] * lw + data[bottom + 4] * fx) * fy;
    out[2] = (data[top + 2] * lw + data[top + 5] * fx) * tw + (data[bottom + 2] * lw + data[bottom + 5] * fx) * fy;
  }
  sample(x, y, out) { this.read(this.front, x, y, out); }
  step(seconds) {
    if (!this.active) return;
    const dt = Math.max(0, Math.min(.05, seconds));
    const decay = Math.exp(-dt * this.decayRate), inkDecay = Math.exp(-dt * (this.decayRate + .5));
    const xScale = Math.max(1, this.aspect), yScale = Math.max(1, 1 / this.aspect);
    let peak = 0;
    for (let y = 0; y < this.rows; y++) for (let x = 0; x < this.columns; x++) {
      const i = (y * this.columns + x) * 3, u = x / (this.columns - 1), v = y / (this.rows - 1);
      const transport = this.continuousWake ? .65 : 2;
      this.read(this.front, u - this.front[i] * dt * transport, v - this.front[i + 1] * dt * transport, this.advected);
      let dx = this.advected[0] * decay, dy = this.advected[1] * decay, ink = this.advected[2] * inkDecay;
      for (const stroke of this.strokes) {
        let rx = (u - stroke.x) * xScale, ry = (v - stroke.y) * yScale;
        if (this.continuousWake) {
          const ax = (u - stroke.fromX) * xScale, ay = (v - stroke.fromY) * yScale;
          const bx = (stroke.x - stroke.fromX) * xScale, by = (stroke.y - stroke.fromY) * yScale;
          const along = Math.max(0, Math.min(1, (ax * bx + ay * by) / (bx * bx + by * by || 1)));
          rx = ax - bx * along; ry = ay - by * along;
          const distance = rx * rx + ry * ry;
          if (distance > .0225) continue;
          const weight = Math.exp(-distance / .0032), travel = Math.hypot(stroke.dx * xScale, stroke.dy * yScale);
          const curl = Math.min(.025, travel * .55);
          dx += (stroke.dx * 4.2 - ry * curl) * weight; dy += (stroke.dy * 4.2 + rx * curl) * weight;
          ink = Math.max(ink, Math.min(.7, travel * 18) * weight);
          continue;
        }
        const distance = rx * rx + ry * ry;
        if (distance > .045) continue;
        const weight = Math.exp(-distance / .0075), speed = stroke.speed;
        dx += (stroke.dx * 2.8 - ry * speed * .16) * weight; dy += (stroke.dy * 2.8 + rx * speed * .16) * weight;
        ink += speed * weight * .3;
      }
      this.back[i] = Math.max(-.18, Math.min(.18, dx)); this.back[i + 1] = Math.max(-.18, Math.min(.18, dy));
      this.back[i + 2] = Math.min(.8, ink);
      peak = Math.max(peak, Math.abs(dx), Math.abs(dy), ink);
    }
    [this.front, this.back] = [this.back, this.front];
    this.strokes.length = 0; this.energy = peak;
    if (!this.active) this.clear();
  }
}

// ---- GPU pipeline: pass 1 = liquid source → tint → glyph index per cell; pass 2 = glyph atlas ----
const c = document.getElementById('c');
const gl = c.getContext('webgl', { antialias: false, depth: false, stencil: false, premultipliedAlpha: false });
const QUAD = 'attribute vec2 p;varying vec2 v;void main(){v=p;gl_Position=vec4(p*2.0-1.0,0,1);}';
const CELLS = `precision highp float;varying vec2 v;uniform sampler2D flow,lut;uniform float aspect,time,moving;
void main(){
  vec2 uv=vec2(v.x,1.0-v.y);
  vec3 f=moving>0.5?(texture2D(flow,uv).rgb-vec3(0.5,0.5,0.0))*vec3(0.36,0.36,0.8):vec3(0.0);
  float px=(uv.x-0.5-f.x)*aspect, py=uv.y-0.5-f.y;
  float qx=px+0.22*sin(py*5.2+time*0.17)+0.15*sin(px*2.4-py*3.1-time*0.1);
  float qy=py+0.19*sin(px*3.5+time*0.13);
  float radius=length(vec2(qx*0.8+0.18,qy*1.1));
  float folds=0.5+0.5*sin(radius*14.0-qx*2.8+sin(qy*5.0)*1.4-time*0.24);
  float cloud=0.5+0.5*sin(qx*3.6-qy*2.9+time*0.09);
  float light=clamp(folds*folds*(0.48+cloud*0.32)-0.075+f.z*0.75,0.0,1.0);
  float value=floor(light*255.0+0.5);
  float r=value<10.0?0.0:min(255.0,value*1.45), g=r*185.0/232.0;       // amber ink, as on asciify.org
  float lum=floor(0.299*r+0.587*g);
  gl_FragColor=vec4(texture2D(lut,vec2((lum+0.5)/256.0,0.5)).a, r/255.0, g/255.0, 0.0);
}`;
const GLYPHS = `precision mediump float;varying vec2 v;uniform sampler2D cells,atlas;uniform vec2 grid,cell,atlasSize;uniform float tile,pad;
void main(){vec2 g=vec2(v.x,1.0-v.y)*grid;vec4 d=texture2D(cells,(floor(g)+0.5)/grid);vec2 l=fract(g);
vec2 uv=(vec2(floor(d.r*255.0+0.5)*tile,0.0)+pad+l*cell)/atlasSize;gl_FragColor=vec4(d.gba*texture2D(atlas,uv).a,1.0);}`;

const sh = (type, code) => { const o = gl.createShader(type); gl.shaderSource(o, code); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
const program = (frag) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, QUAD)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(p); gl.useProgram(p); const a = gl.getAttribLocation(p, 'p'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0); return p; };
const texture = (unit, filter) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  for (const k of ['WRAP_S', 'WRAP_T']) gl.texParameteri(gl.TEXTURE_2D, gl[`TEXTURE_${k}`], gl.CLAMP_TO_EDGE);
  for (const k of ['MIN_FILTER', 'MAG_FILTER']) gl.texParameteri(gl.TEXTURE_2D, gl[`TEXTURE_${k}`], filter); return t; };
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);

const cellsTex = texture(0, gl.NEAREST), atlasTex = texture(1, gl.LINEAR), flowTex = texture(2, gl.LINEAR), lutTex = texture(3, gl.NEAREST);
const glyphProg = program(GLYPHS), cellProg = program(CELLS);
const U = (p, n) => gl.getUniformLocation(p, n);
gl.useProgram(glyphProg); gl.uniform1i(U(glyphProg, 'cells'), 0); gl.uniform1i(U(glyphProg, 'atlas'), 1);
gl.useProgram(cellProg); gl.uniform1i(U(cellProg, 'flow'), 2); gl.uniform1i(U(cellProg, 'lut'), 3);
const fbo = gl.createFramebuffer();

// Ask the engine which glyph each luminance 0..255 gets (256 one-pixel cells over a gray ramp).
{
  const ramp = document.createElement('canvas'); ramp.width = 256; ramp.height = 1;
  const rx = ramp.getContext('2d'), id = rx.createImageData(256, 1);
  for (let i = 0; i < 256; i++) id.data.set([i, i, i, 255], i * 4);
  rx.putImageData(id, 0, 0);
  const row = imageToAsciiFrame(ramp, { ...OPTIONS, fontSize: 1, charAspect: 1, charSpacing: 1 }, 256, 1).frame[0];
  const lut = new Uint8Array(256 * 4);
  row.forEach((cell, i) => lut[i * 4 + 3] = Math.max(0, CHARS.indexOf(cell.char)));
  gl.activeTexture(gl.TEXTURE3); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, lut);
}

function buildAtlas(cellW, cellH) {                             // glyphs rasterized at exact cell size, as on asciify.org
  const a = document.createElement('canvas'), ax = a.getContext('2d');
  const tile = Math.ceil(cellW) + PAD * 2;
  a.width = tile * CHARS.length; a.height = Math.ceil(cellH) + PAD * 2;
  ax.font = `${.9 * Math.min(cellW / .55, cellH)}px "JetBrains Mono", monospace`;
  ax.textAlign = 'center'; ax.textBaseline = 'middle'; ax.fillStyle = '#fff';
  [...CHARS].forEach((ch, i) => ax.fillText(ch, i * tile + PAD + cellW / 2, PAD + cellH / 2));
  gl.activeTexture(gl.TEXTURE1); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, a);
  gl.useProgram(glyphProg);
  gl.uniform2f(U(glyphProg, 'cell'), cellW, cellH); gl.uniform2f(U(glyphProg, 'atlasSize'), a.width, a.height);
  gl.uniform1f(U(glyphProg, 'tile'), tile); gl.uniform1f(U(glyphProg, 'pad'), PAD);
}

let W, H, cols, rows, flow, flowBytes;
function reset() {
  W = innerWidth; H = innerHeight; c.width = W * SCALE; c.height = H * SCALE;
  c.style.width = W + 'px'; c.style.height = H + 'px';
  const fontSize = Math.max(MIN_FONT, Math.sqrt(W * H * OPTIONS.charAspect / MAX_GLYPHS));   // site's grid rule
  cols = Math.floor(W / (fontSize * OPTIONS.charSpacing)); rows = Math.floor(H / (fontSize / OPTIONS.charAspect * OPTIONS.charSpacing));
  const aspect = W / H;
  flow = new FluidField(aspect); flowBytes = new Uint8Array(flow.columns * flow.rows * 3);
  gl.activeTexture(gl.TEXTURE0); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, cols, rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, cellsTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(glyphProg); gl.uniform2f(U(glyphProg, 'grid'), cols, rows);
  gl.useProgram(cellProg); gl.uniform1f(U(cellProg, 'aspect'), aspect);
  buildAtlas(c.width / cols, c.height / rows);
}
addEventListener('resize', reset); reset();
addEventListener('pointermove', e => flow.move(e.clientX / W, e.clientY / H));
addEventListener('pointerleave', () => flow.leave());

// FluidField.front is [dx, dy, ink] per cell; pack to bytes for the GPU (dx,dy ∈ ±.18, ink ∈ 0..8).
function uploadFlow() {
  const f = flow.front;
  for (let i = 0, n = f.length; i < n; i += 3) {
    flowBytes[i] = 127.5 + f[i] / .36 * 255; flowBytes[i + 1] = 127.5 + f[i + 1] / .36 * 255; flowBytes[i + 2] = f[i + 2] / .8 * 255;
  }
  gl.activeTexture(gl.TEXTURE2);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, flow.columns, flow.rows, 0, gl.RGB, gl.UNSIGNED_BYTE, flowBytes);
}

let last = 0, time = 12;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - .5) return;
  const dt = last ? Math.min(.05, (now - last) / 1000) : 1 / 60; last = now;
  time = 12 + (time - 12 + dt) % (200 * Math.PI);                // every sin coefficient is a multiple of .01 → exact period
  flow.step(dt);
  const moving = flow.active;
  if (moving) uploadFlow();
  gl.useProgram(cellProg);
  gl.uniform1f(U(cellProg, 'time'), time); gl.uniform1f(U(cellProg, 'moving'), moving ? 1 : 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, cols, rows); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, c.width, c.height);
  gl.useProgram(glyphProg); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(frame);
</script>
