name: Apple apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: python3 tools/generate_runtime.py --check
      - run: xcodegen generate --spec apple/project.yml
      - name: Build iPhone and iPad simulator app
        run: xcodebuild -project apple/ASCIIPaper.xcodeproj -scheme ASCIIPaper-iOS -destination 'generic/platform=iOS Simulator' -derivedDataPath apple/build CODE_SIGNING_ALLOWED=NO build
      - name: Build macOS app
        run: xcodebuild -project apple/ASCIIPaper.xcodeproj -scheme ASCIIPaper-macOS -destination 'platform=macOS' -derivedDataPath apple/build CODE_SIGNING_ALLOWED=NO build
      - name: macOS Studio runtime self-test
        run: |
          mkdir -p apple/selftest
          apple/build/Build/Products/Debug/ASCIIPaper-macOS.app/Contents/MacOS/ASCIIPaper-macOS --selftest "$PWD/apple/selftest" &
          task_pid=$!
          for attempt in {1..120}; do
            if ! kill -0 "$task_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$task_pid" 2>/dev/null; then kill "$task_pid"; echo 'Apple self-test timed out'; exit 1; fi
          task_status=0
          wait "$task_pid" || task_status=$?
          cat apple/selftest/selftest.json
          exit "$task_status"
      - name: iPhone simulator Studio runtime self-test
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone") and d["state"]=="Shutdown"))')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" apple/build/Build/Products/Debug-iphonesimulator/ASCIIPaper-iOS.app
          # SpringBoard can refuse launches for a while after boot reports done ("denied by service delegate").
          for attempt in {1..12}; do
            xcrun simctl launch "$device_id" io.github.cyoren.asciipaper --selftest && break
            if [ "$attempt" = 12 ]; then exit 1; fi
            sleep 10
          done
          app_container=$(xcrun simctl get_app_container "$device_id" io.github.cyoren.asciipaper data)
          for attempt in {1..300}; do
            if test -f "$app_container/Documents/selftest.json"; then break; fi
            sleep 1
          done
          cp "$app_container/Documents/selftest.json" apple/selftest/ios.json
          cp "$app_container/Documents/studio.png" apple/selftest/ios.png
          cat apple/selftest/ios.json
          xcrun simctl shutdown "$device_id"
          python3 -c 'import json; assert json.load(open("apple/selftest/ios.json"))["ok"] is True'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-unsigned-apps
          path: |
            apple/build/Build/Products/Debug*/*.app
            apple/selftest
